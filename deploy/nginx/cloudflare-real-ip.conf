# =============================================================================
# deploy/nginx/cloudflare-real-ip.conf
# Recuperar la IP real de quien usa la aplicación cuando hay Cloudflare delante.
#
# APLICAR ESTO **ANTES** DE ACTIVAR CLOUDFLARE. NO DESPUÉS.
#
# EL PROBLEMA, MEDIDO
# Hoy la cadena es:   persona → nginx → aplicación
# Con Cloudflare:     persona → Cloudflare → nginx → aplicación
#
# `src/app.js` tiene `app.set('trust proxy', 1)`: confía en UN salto. Con dos,
# Express deja de ver a la persona y ve a Cloudflare. Medido:
#
#     hoy                     req.ip = 190.104.22.5   ← la persona
#     con Cloudflare, sin esto  req.ip = 172.68.10.3   ← Cloudflare
#
# QUÉ SE ROMPE SI NO SE APLICA
#
#   1. EL LOGIN, PARA TODA LA EMPRESA. `authRoutes.js` limita a 5 intentos de
#      login por IP cada 15 minutos. Si todas las peticiones llegan con la
#      misma media docena de IPs de Cloudflare, esa cuota pasa a ser
#      COMPARTIDA: el sexto intento del día, de quien sea, se rechaza con 429.
#      Y no es un error obvio — dice «demasiados intentos desde esta IP», que
#      es justo lo que nadie va a entender porque cada uno intentó una vez.
#
#   2. LA BITÁCORA DE AUDITORÍA. Los 28 sitios que guardan `req.ip` empezarían
#      a registrar la IP de Cloudflare. El registro seguiría llenándose, sin
#      errores, y sería inútil: todas las acciones desde la misma dirección.
#
#   3. EL LÍMITE GLOBAL de 1000 peticiones cada 15 minutos, por el mismo motivo.
#
# CÓMO LO RESUELVE
# `set_real_ip_from` le dice a nginx en qué direcciones confiar, y
# `real_ip_header CF-Connecting-IP` le dice de qué cabecera sacar la verdadera.
# Cloudflare pone ahí la IP de quien pidió, y sólo Cloudflare puede ponerla
# —cualquier cabecera CF-Connecting-IP que mande un tercero se descarta, porque
# no viene de una de las direcciones listadas.
#
# Con esto, `$remote_addr` dentro de nginx YA ES la persona, el
# `X-Forwarded-For` que se arma queda correcto, y la aplicación sigue
# funcionando sin cambiar una línea: `trust proxy: 1` vuelve a ser cierto.
#
# CÓMO INSTALARLO
#   1. Copiar este archivo a  /etc/nginx/conf.d/cloudflare-real-ip.conf
#   2. sudo nginx -t          (tiene que decir «syntax is ok»)
#   3. sudo systemctl reload nginx
#   4. Recién ahí activar el proxy naranja en Cloudflare.
#
# MANTENIMIENTO
# Cloudflare cambia sus rangos de vez en cuando —pocas veces al año—. La lista
# viva está en https://www.cloudflare.com/ips/ y se puede traer con:
#
#     curl -s https://www.cloudflare.com/ips-v4
#     curl -s https://www.cloudflare.com/ips-v6
#
# Un rango nuevo que falte acá NO deja a nadie afuera: las peticiones que
# lleguen por esa vía se atienden igual, sólo que su IP se registra como la de
# Cloudflare. O sea que el síntoma de una lista desactualizada es el problema
# original, en pequeño. Conviene revisarla una vez al año.
#
# Rangos vigentes al 2026-09-09.
# =============================================================================

# ── IPv4 ─────────────────────────────────────────────────────────────────────
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# ── IPv6 ─────────────────────────────────────────────────────────────────────
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# La cabecera que pone Cloudflare con la IP de quien pidió. Sólo se acepta si
# viene de una de las direcciones de arriba.
real_ip_header CF-Connecting-IP;

# Sin `real_ip_recursive on`: CF-Connecting-IP trae UNA sola dirección, la de la
# persona. Lo recursivo sirve para recorrer un X-Forwarded-For con varios saltos
# y acá haría trabajo de más sobre un valor que ya es el correcto.
